aid: notable
name: Notable
description: 'Notable is an intelligent-automation company purpose-built for healthcare,
  applying AI agents to administrative and operational workflows across patient access,
  revenue cycle management, care operations, and contact-center automation. Its platform
  pairs a library of prebuilt AI Agents with Flow Builder, a low-code interface for
  designing, training, and deploying automations, Sidekick, a human-in-the-loop AI
  co-pilot for clinically complex work such as prior authorization, and Flow AI, a
  conversational assistant for workflow builders. Integration runs bi-directionally
  against Epic, Oracle Health/Cerner, MEDITECH, athenahealth and eClinicalWorks over
  a mix of FHIR APIs, HL7 interfaces, RPA and third-party APIs. Notable reports
  deployment at 12,000+ sites of care serving 38M+ patients, with customers including
  Intermountain Health, MUSC Health, CommonSpirit Health and CityMD, and is backed by
  ICONIQ Growth, Greylock, F-Prime, Oak HC/FT, Maverick Ventures and 8VC. Notable
  publishes no public API contract; its developer documentation sits behind customer
  SSO. This profile is enriched from the company''s public trust, security, and
  llms.txt surfaces.'
