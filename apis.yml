aid: notable
name: Notable
description: 'Notable is an intelligent-automation company purpose-built for healthcare,
  applying AI agents to administrative and operational workflows across patient access,
  revenue cycle management, care operations, and contact-center automation. Its platform
  pairs a library of prebuilt AI Agents with Flow Builder, a low-code interface for
  designing, training, and deploying automations, and Sidekick, a natural-language
  assistant for staff. Deployed at more than 1,000 healthcare locations and used by
  health systems including Intermountain Healthcare and the Medical University of
  South Carolina, Notable is backed by Greylock and ICONIQ Capital. This profile has
  been enriched from the company''s public trust, security, and developer surfaces.'
